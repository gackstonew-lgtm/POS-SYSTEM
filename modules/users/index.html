<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User Management - Karing Enterprise</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/assets/css/basics.css" rel="stylesheet">
    <link href="/assets/css/modules.css" rel="stylesheet">
    <link href="/assets/css/pos.css" rel="stylesheet">
</head>
<body>
    <div id="appTopbar"></div>
    <div id="appSidebar"></div>

    <main class="module-shell has-sidebar">
        <div class="module-page">
            <div id="flashAlert" class="alert d-none mb-0" role="alert"></div>

            <section class="module-hero">
                <div>
                    <h1>User Management</h1>
                    <p>Create users, assign roles, reset passwords, and disable accounts.</p>
                </div>
                <button class="btn btn-primary" id="addNewBtn"><i class="bi bi-person-plus"></i> Add User</button>
            </section>

            <section class="module-grid-2">
                <div class="module-table-wrap">
                    <div class="module-panel border-0 border-bottom rounded-0">
                        <h2>System Users</h2>
                        <p>Only Super Admins can manage login accounts.</p>
                        <form class="filter-bar" id="searchForm">
                            <input class="form-control" type="search" id="searchInput" placeholder="Search users">
                            <select class="form-select" disabled><option>All Roles</option></select>
                            <button class="btn btn-outline-primary" type="submit">Search</button>
                        </form>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Last Login</th><th>Actions</th></tr></thead>
                            <tbody id="tableBody">
                                <tr><td colspan="6" class="text-center text-muted py-4">Loading users...</td></tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="module-panel border-0 border-top rounded-0">
                        <ul class="pagination mb-0" id="pagination"></ul>
                    </div>
                </div>

                <aside class="module-panel">
                    <h2 id="formTitle">Create User</h2>
                    <p class="mb-3">Use strong passwords and disable accounts instead of deleting audit history.</p>
                    <form class="quick-form" id="userForm">
                        <input type="hidden" id="userId" value="0">
                        <div>
                            <label for="name">Name</label>
                            <input class="form-control" id="name" name="name" type="text" required placeholder="User full name">
                        </div>
                        <div>
                            <label for="email">Email</label>
                            <input class="form-control" id="email" name="email" type="email" required placeholder="user@example.com">
                        </div>
                        <div>
                            <label for="role">Role</label>
                            <select class="form-select" id="role" name="role" required>
                                <option value="super_admin">Super Admin</option>
                                <option value="admin">Admin</option>
                                <option value="cashier">Cashier</option>
                            </select>
                        </div>
                        <div>
                            <label for="password" id="passwordLabel">Password</label>
                            <input class="form-control" id="password" name="password" type="password" minlength="8" placeholder="••••••••">
                        </div>
                        <div>
                            <label for="is_active">Status</label>
                            <select class="form-select" id="is_active" name="is_active">
                                <option value="1">Active</option>
                                <option value="0">Disabled</option>
                            </select>
                        </div>
                        <div class="d-flex gap-2 mt-2">
                            <button class="btn btn-primary" type="submit" id="saveBtn"><i class="bi bi-save"></i> Save User</button>
                            <button class="btn btn-outline-secondary d-none" type="button" id="cancelBtn">Cancel Edit</button>
                        </div>
                    </form>
                </aside>
            </section>
        </div>
    </main>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/layout.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            KaringLayout.init({ allowedRoles: ['super_admin'] });

            let currentPage = 1;
            let currentSearch = '';

            const tableBody = document.getElementById('tableBody');
            const pagination = document.getElementById('pagination');
            const searchForm = document.getElementById('searchForm');
            const searchInput = document.getElementById('searchInput');
            const userForm = document.getElementById('userForm');
            const formTitle = document.getElementById('formTitle');
            const passwordLabel = document.getElementById('passwordLabel');
            const passwordInput = document.getElementById('password');
            const cancelBtn = document.getElementById('cancelBtn');
            const flashAlert = document.getElementById('flashAlert');

            function showFlash(type, msg) {
                flashAlert.className = `alert alert-${type} mb-3`;
                flashAlert.textContent = msg;
                flashAlert.classList.remove('d-none');
            }

            async function loadUsers(page = 1, q = '') {
                currentPage = page;
                currentSearch = q;
                tableBody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">Loading...</td></tr>';

                try {
                    const res = await KaringApi.getUsersList(q, page);
                    if (!res.users || res.users.length === 0) {
                        tableBody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">No users found.</td></tr>';
                    } else {
                        tableBody.innerHTML = res.users.map((u) => `
                            <tr>
                                <td><strong>${KaringLayout.escapeHtml(u.name)}</strong></td>
                                <td>${KaringLayout.escapeHtml(u.email)}</td>
                                <td>${KaringLayout.escapeHtml(u.role_label)}</td>
                                <td>${Number(u.is_active) === 1 ? '<span class="badge-soft success">Active</span>' : '<span class="badge-soft danger">Disabled</span>'}</td>
                                <td>${KaringLayout.escapeHtml(u.last_login_at || 'Never')}</td>
                                <td>
                                    <button class="btn btn-sm btn-outline-primary edit-btn" data-id="${u.id}">Edit</button>
                                </td>
                            </tr>
                        `).join('');
                    }

                    renderPagination(res.pages, res.page);
                } catch (err) {
                    showFlash('danger', err.message || 'Error loading users.');
                }
            }

            function renderPagination(totalPages, page) {
                if (totalPages <= 1) {
                    pagination.innerHTML = '';
                    return;
                }
                let html = '';
                for (let i = 1; i <= totalPages; i++) {
                    html += `<li class="page-item ${i === page ? 'active' : ''}"><a class="page-link" href="#" data-page="${i}">${i}</a></li>`;
                }
                pagination.innerHTML = html;
            }

            pagination.addEventListener('click', (e) => {
                e.preventDefault();
                const target = e.target.closest('[data-page]');
                if (target) {
                    loadUsers(Number(target.dataset.page), currentSearch);
                }
            });

            searchForm.addEventListener('submit', (e) => {
                e.preventDefault();
                loadUsers(1, searchInput.value.trim());
            });

            document.getElementById('addNewBtn').addEventListener('click', resetForm);
            cancelBtn.addEventListener('click', resetForm);

            function resetForm() {
                document.getElementById('userId').value = '0';
                userForm.reset();
                document.getElementById('role').value = 'cashier';
                document.getElementById('is_active').value = '1';
                passwordInput.required = true;
                passwordLabel.textContent = 'Password';
                formTitle.textContent = 'Create User';
                cancelBtn.classList.add('d-none');
            }

            tableBody.addEventListener('click', async (e) => {
                const editBtn = e.target.closest('.edit-btn');

                if (editBtn) {
                    const id = Number(editBtn.dataset.id);
                    try {
                        const res = await KaringApi.request(`/users?id=${id}`, { method: 'GET' });
                        if (res.user) {
                            const u = res.user;
                            document.getElementById('userId').value = u.id;
                            document.getElementById('name').value = u.name || '';
                            document.getElementById('email').value = u.email || '';
                            document.getElementById('role').value = u.role || 'cashier';
                            document.getElementById('is_active').value = String(u.is_active ?? 1);
                            passwordInput.required = false;
                            passwordLabel.textContent = 'New Password (leave blank to keep)';
                            formTitle.textContent = 'Edit User';
                            cancelBtn.classList.remove('d-none');
                            window.scrollTo({ top: userForm.offsetTop - 80, behavior: 'smooth' });
                        }
                    } catch (err) {
                        showFlash('danger', err.message);
                    }
                }
            });

            userForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const saveBtn = document.getElementById('saveBtn');
                saveBtn.disabled = true;

                const payload = {
                    id: Number(document.getElementById('userId').value || 0),
                    name: document.getElementById('name').value.trim(),
                    email: document.getElementById('email').value.trim(),
                    role: document.getElementById('role').value,
                    password: passwordInput.value,
                    is_active: Number(document.getElementById('is_active').value)
                };

                try {
                    const res = await KaringApi.saveUser(payload);
                    showFlash('success', res.message || 'Saved user successfully.');
                    resetForm();
                    loadUsers(currentPage, currentSearch);
                } catch (err) {
                    showFlash('danger', err.message);
                } finally {
                    saveBtn.disabled = false;
                }
            });

            resetForm();
            loadUsers();
        });
    </script>
</body>
</html>
