<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sales Receipt - Karing Enterprise</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/assets/css/basics.css" rel="stylesheet">
    <link href="/assets/css/modules.css" rel="stylesheet">
    <link href="/assets/css/pos.css" rel="stylesheet">
</head>
<body>
    <main class="module-shell">
        <section class="module-panel mx-auto mt-4" style="max-width: 520px;" id="receiptCard">
            <div class="text-center py-4">
                <div class="spinner-border text-primary" role="status"></div>
                <div class="mt-2 text-muted">Loading receipt details...</div>
            </div>
        </section>
    </main>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/layout.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const saleId = Number(params.get('sale_id') || 0);
            const receiptCard = document.getElementById('receiptCard');

            if (saleId <= 0) {
                receiptCard.innerHTML = `
                    <div class="alert alert-danger text-center mb-0">
                        <i class="bi bi-exclamation-triangle fs-1 d-block mb-2"></i>
                        Receipt not found.
                    </div>
                `;
                return;
            }

            try {
                const data = await KaringApi.getReceiptData(saleId);
                const s = data.sale;
                const items = data.items || [];

                const itemsHtml = items.map((line) => `
                    <tr>
                        <td>
                            ${KaringLayout.escapeHtml(line.name)}<br>
                            <span class="text-muted">${KaringLayout.money(line.unit_price)}</span>
                        </td>
                        <td class="text-end">${Number(line.quantity)}</td>
                        <td class="text-end">${KaringLayout.money(line.line_total)}</td>
                    </tr>
                `).join('');

                const mpesaHtml = s.payment_method === 'mpesa' ? `
                    <div><strong>M-PESA Receipt:</strong> ${KaringLayout.escapeHtml(s.mpesa_receipt || 'Pending')}</div>
                    <div><strong>M-PESA Phone:</strong> ${KaringLayout.escapeHtml(s.mpesa_phone || '-')}</div>
                    <div><strong>Transaction Date:</strong> ${KaringLayout.escapeHtml(s.mpesa_date || '-')}</div>
                ` : '';

                receiptCard.innerHTML = `
                    <div class="text-center mb-3">
                        <h1 class="h4 mb-1">Karing Enterprise</h1>
                        <p class="text-muted mb-0">Sales Receipt</p>
                    </div>

                    <div class="d-flex justify-content-between border-top border-bottom py-2 mb-3">
                        <span>Receipt</span>
                        <strong>${KaringLayout.escapeHtml(s.reference)}</strong>
                    </div>

                    <div class="small mb-3">
                        <div><strong>Date:</strong> ${KaringLayout.escapeHtml(s.created_at)}</div>
                        <div><strong>Cashier:</strong> ${KaringLayout.escapeHtml(s.cashier_name)}</div>
                        <div><strong>Customer:</strong> ${KaringLayout.escapeHtml(s.customer_name)}</div>
                        <div><strong>Payment Method:</strong> ${KaringLayout.escapeHtml(s.payment_method.toUpperCase())}</div>
                        ${mpesaHtml}
                    </div>

                    <table class="table table-sm">
                        <thead><tr><th>Item</th><th class="text-end">Qty</th><th class="text-end">Total</th></tr></thead>
                        <tbody>${itemsHtml}</tbody>
                    </table>

                    <div class="border-top pt-3">
                        <div class="summary-row"><span>Subtotal</span><strong>${KaringLayout.money(s.subtotal)}</strong></div>
                        <div class="summary-row"><span>Discount</span><strong>${KaringLayout.money(s.discount)}</strong></div>
                        <div class="summary-row"><span>Tax</span><strong>${KaringLayout.money(s.tax)}</strong></div>
                        <div class="summary-row"><span class="summary-total">Total</span><strong class="summary-total">${KaringLayout.money(s.total)}</strong></div>
                    </div>

                    <div class="d-print-none mt-3 d-flex gap-2">
                        <button class="btn btn-primary" onclick="window.print()"><i class="bi bi-printer"></i> Print Receipt</button>
                        <a class="btn btn-outline-primary" href="/modules/pos/pos_checkout.html">Back to POS</a>
                    </div>
                `;

                setTimeout(() => window.print(), 500);
            } catch (err) {
                receiptCard.innerHTML = `
                    <div class="alert alert-danger text-center mb-0">
                        <i class="bi bi-exclamation-triangle fs-1 d-block mb-2"></i>
                        ${KaringLayout.escapeHtml(err.message || 'Error loading receipt.')}
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
