<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign In - Karing Enterprise POS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/assets/css/basics.css" rel="stylesheet">
    <link href="/assets/css/modules.css" rel="stylesheet">
    <link href="/assets/css/pos.css" rel="stylesheet">
</head>
<body>
    <main class="login-page">
        <section class="login-card">
            <div class="mb-4">
                <span class="brand-mark">KE</span>
                <h1 class="h4 mt-3 mb-1">Sign in to Karing Enterprise</h1>
                <p class="text-muted mb-0">Use your assigned POS account.</p>
            </div>
            <div id="loginAlert" class="alert alert-danger d-none" role="alert"></div>
            <form id="loginForm" class="quick-form">
                <div>
                    <label for="email">Email</label>
                    <input class="form-control" id="email" name="email" type="email" required autofocus placeholder="admin@karing.local">
                </div>
                <div>
                    <label for="password">Password</label>
                    <input class="form-control" id="password" name="password" type="password" required placeholder="••••••••">
                </div>
                <button class="btn btn-primary btn-lg" id="submitBtn" type="submit">Login</button>
            </form>
        </section>
    </main>

    <script src="/assets/js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = KaringApi.getStoredUser();
            if (user && KaringApi.getToken()) {
                window.location.href = user.role === 'cashier' ? '/modules/pos/pos_checkout.html' : '/index.html';
                return;
            }

            const loginForm = document.getElementById('loginForm');
            const loginAlert = document.getElementById('loginAlert');
            const submitBtn = document.getElementById('submitBtn');

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                loginAlert.classList.add('d-none');
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Logging in...';

                try {
                    const email = document.getElementById('email').value.trim();
                    const password = document.getElementById('password').value;
                    const res = await KaringApi.login(email, password);
                    window.location.href = res.user.role === 'cashier' ? '/modules/pos/pos_checkout.html' : '/index.html';
                } catch (err) {
                    loginAlert.textContent = err.message || 'Invalid email, password, or disabled account.';
                    loginAlert.classList.remove('d-none');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Login';
                }
            });
        });
    </script>
</body>
</html>
